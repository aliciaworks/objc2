name: generate visionOS bindings

# The generator needs all ten platform SDKs and a libclang from the same era as the headers, which is what a
# macOS runner with Xcode is and what a borrowed Linux tree is not.
#
# It runs **all** the frameworks, and that is not thoroughness: a run rewrites its crate's feature list from
# the SDK it read, and the sibling crates that name those features are only rewritten in the same pass. One
# framework on its own produces a workspace that cannot resolve - which is why upstream's own CI runs `all`
# too, and why the attempts here to do one at a time kept failing one level further down.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generate-visionos.yml'
      # So that putting a run's manifests back, or fixing one, is also a run: nothing here commits, so
      # this cannot loop.
      - 'framework-crates/**'

jobs:
  generate:
    runs-on: macos-26
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Upstream generates with Xcode 27, and the headers decide what the translator meets - so the newest
      # Xcode the image carries is the one to use, not the image's default. `sort -V` so that 27.0 beats
      # 26.6 rather than sorting as text.
      - name: Which Xcode
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app || true
          pick="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "using ${pick}"
          echo "DEVELOPER_DIR=${pick}/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="${pick}/Contents/Developer" xcodebuild -version

      - name: Build the translator
        run: cargo build --release -p header-translator

      # A clean slate: this branch carries real generated directories, and the translator's `create_dir_all`
      # on a path that already exists as a symlink is an EPERM on macOS.
      - name: Generate
        run: |
          set -euo pipefail
          rm -rf generated framework-crates/objc2-ar-kit/src/generated
          rm -rf framework-crates/objc2-compositor-services/src/generated
          cargo run --release -p header-translator --bin header-translator all

      # Two things, and they are for different reasons. The two crates carry the whole crate, because a
      # run rewrites a feature list in its Cargo.toml and the imports its lib.rs opens with. Every manifest
      # in the closure is carried because cargo resolves the whole workspace before it builds anything, so a
      # member left on the iOS run's feature names is a workspace that does not resolve.
      - name: Collect what a consumer needs
        run: |
          set -euo pipefail
          mkdir -p out/crates out/manifests
          cp -a framework-crates/objc2-ar-kit out/crates/
          cp -a framework-crates/objc2-compositor-services out/crates/
          for d in framework-crates/*/; do
            [ -f "$d/Cargo.toml" ] && cp "$d/Cargo.toml" "out/manifests/$(basename "${d%/}").toml"
          done
          echo "crates:    $(ls out/crates)"
          echo "manifests: $(ls out/manifests | wc -l)"

      - name: What the backend needs
        run: |
          set -euo pipefail
          for n in ar_plane_detection_provider_create ar_plane_anchors_enumerate_anchors_f \
                   cp_drawable_set_device_anchor ar_session_create; do
            if grep -rq "fn $n" out/crates; then echo "  generated  $n"; else echo "  MISSING    $n"; fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: visionos-generated
          path: out/
          retention-days: 30
