name: generate visionOS bindings

# The generator needs all ten platform SDKs and a libclang from the same era as the headers, which is
# what a macOS runner with Xcode is and what a borrowed Linux tree is not. This runs it on the real thing
# and uploads the result: Rust declarations of the API, which is what `objc2` publishes and what nobody
# redistributes an SDK for.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generate-visionos.yml'

jobs:
  generate:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Which Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Build the translator
        run: cargo build --release -p header-translator

      # One framework per run, and the manifests are put back in between: a run rewrites its crate's
      # feature list from the SDK it read, and a second run then cannot resolve the workspace.
      - name: ARKit, from the visionOS SDK
        run: |
          set -euo pipefail
          cargo run --release -p header-translator --bin header-translator objc2-ar-kit
          mkdir -p out
          cp -a generated/ARKit out/ARKit
          # The manifest too: a run rewrites its crate's feature list from the SDK it read, and
          # the checked-in one is the iOS run's - so the two do not name each other's features.
          mkdir -p out/manifests
          cp framework-crates/objc2-ar-kit/Cargo.toml out/manifests/objc2-ar-kit.toml


      - name: Manifests back
        run: git checkout -- Cargo.toml framework-crates

      - name: CompositorServices, from the visionOS SDK
        run: |
          set -euo pipefail
          cargo run --release -p header-translator --bin header-translator objc2-compositor-services
          cp -a generated/CompositorServices out/CompositorServices
          cp framework-crates/objc2-compositor-services/Cargo.toml out/manifests/objc2-compositor-services.toml


      - name: What the backend needs
        run: |
          set -euo pipefail
          for n in ar_session_create ar_hand_tracking_provider_get_latest_anchors \
                   cp_view_get_transform cp_drawable_set_device_anchor cp_drawable_set_depth_range; do
            if grep -rq "fn $n" out; then echo "  generated  $n"; else echo "  MISSING    $n"; fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: visionos-generated
          path: out/
          retention-days: 30
